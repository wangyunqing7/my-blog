<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">常见 USB 接口类型对比</title>
  <desc id="desc">USB Type-A、Type-B、Micro-B 和 Type-C 四种常见接口的示意图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#f3e7d8"/>
    </linearGradient>
    <style>
      .label{font:600 32px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#433c35}
      .note{font:400 21px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#756a60}
      .shell{fill:#f9f5ef;stroke:#756a60;stroke-width:7}
      .inner{fill:#d97a5b;stroke:#433c35;stroke-width:5}
      .pin{fill:#f8df92}
    </style>
  </defs>
  <rect width="1200" height="560" rx="32" fill="url(#bg)"/>
  <text x="60" y="70" class="label" font-size="38">常见 USB 接口外形</text>
  <text x="60" y="108" class="note">接口外形与协议版本并不是同一概念</text>

  <g transform="translate(70 165)">
    <rect class="shell" x="0" y="20" width="220" height="120" rx="12"/>
    <rect class="inner" x="26" y="44" width="168" height="72" rx="6"/>
    <rect class="pin" x="52" y="57" width="14" height="46" rx="3"/>
    <rect class="pin" x="83" y="57" width="14" height="46" rx="3"/>
    <rect class="pin" x="114" y="57" width="14" height="46" rx="3"/>
    <rect class="pin" x="145" y="57" width="14" height="46" rx="3"/>
    <text x="110" y="205" text-anchor="middle" class="label">Type-A</text>
    <text x="110" y="239" text-anchor="middle" class="note">电脑与充电器常见</text>
  </g>

  <g transform="translate(355 165)">
    <path class="shell" d="M28 20h164l28 34v86H0V54z"/>
    <path class="inner" d="M52 48h116l20 24v42H32V72z"/>
    <circle class="pin" cx="78" cy="79" r="10"/>
    <circle class="pin" cx="142" cy="79" r="10"/>
    <circle class="pin" cx="78" cy="101" r="10"/>
    <circle class="pin" cx="142" cy="101" r="10"/>
    <text x="110" y="205" text-anchor="middle" class="label">Type-B</text>
    <text x="110" y="239" text-anchor="middle" class="note">打印机等设备常见</text>
  </g>

  <g transform="translate(640 165)">
    <path class="shell" d="M14 42h192l14 28-18 70H18L0 70z"/>
    <path class="inner" d="M28 66h164l-10 48H38z"/>
    <g class="pin">
      <rect x="53" y="75" width="10" height="28" rx="2"/><rect x="78" y="75" width="10" height="28" rx="2"/>
      <rect x="103" y="75" width="10" height="28" rx="2"/><rect x="128" y="75" width="10" height="28" rx="2"/>
      <rect x="153" y="75" width="10" height="28" rx="2"/>
    </g>
    <text x="110" y="205" text-anchor="middle" class="label">Micro-B</text>
    <text x="110" y="239" text-anchor="middle" class="note">旧款移动设备常见</text>
  </g>

  <g transform="translate(925 165)">
    <rect class="shell" x="0" y="36" width="220" height="104" rx="52"/>
    <rect class="inner" x="24" y="58" width="172" height="60" rx="30"/>
    <rect x="47" y="83" width="126" height="10" rx="5" fill="#f8df92"/>
    <text x="110" y="205" text-anchor="middle" class="label">Type-C</text>
    <text x="110" y="239" text-anchor="middle" class="note">正反可插，现代设备常见</text>
  </g>

  <rect x="60" y="465" width="1080" height="1" fill="#d7c7b6"/>
  <text x="600" y="510" text-anchor="middle" class="note">同一种接口外形可能支持不同的 USB 传输速度与供电能力</text>
</svg>
